# Cloudtype 자동 배포 (공식 Actions)
#
# 예전 workflow 는 존재하지 않는 저장소 경로(`cd backend`)로 curl 배포를 호출해
# Actions 만 성공하고 실제 서비스는 갱신되지 않았습니다.
#
# 한 번만 설정:
# 1) GitHub repo → Settings → Secrets → Actions
#    - CLOUDTYPE_TOKEN = Cloudtype API Key
#      (이미 CLOUDTYPE_API_KEY 가 있으면 그대로 사용)
# 2) Settings → Variables → Actions
#    - CLOUDTYPE_PROJECT = 스페이스/프로젝트명
#      (Cloudtype 서비스 → CLI 탭의 project 값. 예: isleofsky76/my-project)
# 3) Cloudtype 프로젝트 Secrets 에 MONGO_URI, ADMIN_PASSWORD 등 앱 env 가
#    대시보드와 같은 이름으로 등록되어 있어야 합니다.
#
name: Deploy to Cloudtype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudtype credentials
        id: ct
        env:
          TOKEN_A: ${{ secrets.CLOUDTYPE_TOKEN }}
          TOKEN_B: ${{ secrets.CLOUDTYPE_API_KEY }}
          PROJECT_VAR: ${{ vars.CLOUDTYPE_PROJECT }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_A:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_B:-}"; fi
          PROJECT="${PROJECT_VAR:-}"
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDTYPE_TOKEN 또는 CLOUDTYPE_API_KEY 시크릿이 필요합니다."
            exit 1
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::Actions Variable CLOUDTYPE_PROJECT(스페이스/프로젝트)를 설정해 주세요. Cloudtype 서비스 CLI 탭에서 확인합니다."
            exit 1
          fi
          {
            echo "token=$TOKEN"
            echo "project=$PROJECT"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying to project: $PROJECT"

      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ steps.ct.outputs.token }}
          ghtoken: ${{ github.token }}
          endpoint: https://api.cloudtype.io
          repo: ${{ github.repository }}

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ steps.ct.outputs.token }}
          endpoint: https://api.cloudtype.io
          project: ${{ steps.ct.outputs.project }}
          stage: main
          yaml: |
            name: englishwitheasyword-backend
            app: node@20
            options:
              ports: 3000
              install: npm ci --omit=dev
              start: node index.js
              env:
                - name: MONGO_URI
                  secret: MONGO_URI
                - name: ADMIN_PASSWORD
                  secret: ADMIN_PASSWORD
                - name: GOOGLE_CLIENT_ID
                  secret: GOOGLE_CLIENT_ID
                - name: GOOGLE_CLIENT_SECRET
                  secret: GOOGLE_CLIENT_SECRET
                - name: GOOGLE_API_KEY
                  secret: GOOGLE_API_KEY
                - name: GOOGLE_CLIENT_EMAIL
                  secret: GOOGLE_CLIENT_EMAIL
                - name: GOOGLE_PRIVATE_KEY
                  secret: GOOGLE_PRIVATE_KEY
                - name: OPENAI_API_KEY
                  secret: OPENAI_API_KEY
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
