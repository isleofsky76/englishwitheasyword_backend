# Cloudtype CLI 탭 설정 기준
# project: isleofsky76/englishwitheasyword-backend
#
# Secrets (GitHub → Settings → Secrets → Actions):
#   CLOUDTYPE_TOKEN  = Cloudtype API Key  (또는 기존 CLOUDTYPE_API_KEY)
#   GHP_TOKEN        = GitHub PAT (repo, admin:public_key) — 없으면 github.token 사용
#
name: Deploy to cloudtype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN || secrets.CLOUDTYPE_API_KEY }}
          ghtoken: ${{ secrets.GHP_TOKEN || github.token }}
          endpoint: https://api.cloudtype.io

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN || secrets.CLOUDTYPE_API_KEY }}
          endpoint: https://api.cloudtype.io
          project: isleofsky76/englishwitheasyword-backend
          stage: main
          yaml: |
            name: englishwitheasyword-backend
            app: node@20
            options:
              env:
                - name: NODE_ENV
                  value: production
                - name: OPENAI_API_KEY
                  var: OPENAI_API_KEY
                - name: ADMIN_PASSWORD
                  var: ADMIN_PASSWORD
                - name: MONGO_URI
                  var: MONGO_URI
                - name: GOOGLE_CLIENT_EMAIL
                  var: GOOGLE_CLIENT_EMAIL
                - name: GOOGLE_PRIVATE_KEY
                  var: GOOGLE_PRIVATE_KEY
              ports: 3000
              start: node index.js
              install: npm ci --production
              healthz: /healthz
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
